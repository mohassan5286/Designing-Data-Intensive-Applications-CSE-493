syntax = "proto3";

option java_multiple_files = true;
option java_package = "io.grpc.examples.helloworld.Top10MoviesReply";
option java_outer_classname = "Top10Movies";
option objc_class_prefix = "T10M";

package top10movies;

// The greeting service definition.
service Top10MoviesService {
  // Sends a greeting
  rpc getTop10Movies (top10moviesRequest) returns (top10moviesReply) {}

}

// The request message containing the user's name.
message top10moviesRequest {
}


message Movie {
  string movieId = 1;
  double avg_rating = 2;
}
// The response message containing the greetings
message top10moviesReply {
  repeated Movie top10movies = 1;
}
